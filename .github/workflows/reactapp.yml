name: React App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn eslint "{src,tests}/**/*.{ts,tsx,js,jsx}"

      - name: Run Prettier
        run: yarn prettier --check "**/*.{js,ts,tsx,json,css,scss}"

      - name: Build
        run: yarn build
